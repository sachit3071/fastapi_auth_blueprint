<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Create Account</h1>
            <p class="text-gray-600">Join us today and get started</p>
        </div>

        <!-- Error message display -->
        {% if error %}
        <div style="color: red; padding: 10px; background: #ffeeee; margin: 10px 0; border-radius: 8px;">
            {{ error }}
        </div>
        {% endif %}
        
        {% if success %}
        <div style="color: green; padding: 10px; background: #eeffee; margin: 10px 0; border-radius: 8px;">
            {{ success }}
        </div>
        {% endif %}

        <form method="POST" action="/auth/signup">
            <div class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
                        <input 
                            type="text" 
                            id="firstName" 
                            name="firstName" 
                            placeholder="John"
                            value="{{ firstName or '' }}"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                            required
                        >
                    </div>
                    <div>
                        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
                        <input 
                            type="text" 
                            id="lastName" 
                            name="lastName" 
                            placeholder="Doe"
                            value="{{ lastName or '' }}"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                            required
                        >
                    </div>
                </div>

                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="johndoe"
                        value="{{ username or '' }}"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                        required
                        minlength="3"
                    >
                    <!-- Username availability indicator -->
                    <div id="username-status" class="mt-1 text-sm hidden"></div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="john.doe@example.com"
                        value="{{ email or '' }}"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                        required
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                        required
                        minlength="8"
                    >
                    <p class="text-xs text-gray-500 mt-1">Must be at least 8 characters long</p>
                </div>

                <button 
                    type="submit" 
                    id="submit-btn"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition duration-200 transform hover:scale-[1.02] active:scale-[0.98]"
                >
                    Sign Up
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-600">
                Already have an account? 
                <a href="/auth/signin" class="text-indigo-600 hover:text-indigo-700 font-medium">Sign in</a>
            </p>
        </div>
    </div>

    <script>
        const usernameInput = document.getElementById('username');
        const statusDiv = document.getElementById('username-status');
        const submitBtn = document.getElementById('submit-btn');
        let checkTimeout;

        usernameInput.addEventListener('input', function() {
            clearTimeout(checkTimeout);
            const username = this.value.trim();
            
            if (username.length < 3) {
                statusDiv.classList.add('hidden');
                return;
            }

            statusDiv.textContent = 'Checking...';
            statusDiv.className = 'mt-1 text-sm text-gray-500';
            statusDiv.classList.remove('hidden');

            checkTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(`/auth/verify-username?username=${encodeURIComponent(username)}`);
                    const data = await response.json();
                    
                    if (data.exists) {
                        statusDiv.textContent = '✗ Username already taken';
                        statusDiv.className = 'mt-1 text-sm text-red-600';
                        submitBtn.disabled = true;
                        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    } else {
                        statusDiv.textContent = '✓ Username available';
                        statusDiv.className = 'mt-1 text-sm text-green-600';
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                } catch (error) {
                    statusDiv.classList.add('hidden');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }, 500);
        });
    </script>
</body>
</html>
