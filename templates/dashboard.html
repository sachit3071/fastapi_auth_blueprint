<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo/Brand -->
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-indigo-600">Dashboard</h1>
                </div>
                
                <!-- User Info -->
                <div class="flex items-center space-x-4">
                    <span class="text-gray-700 font-medium">{{ email }}</span>
                    <a href="/auth/signout" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                        Sign Out
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Welcome Section -->
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-6">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Welcome back, {{ email }}!</h2>
            <p class="text-gray-600">Here's what's happening with your account today.</p>
        </div>

        <!-- Content Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Card 1 -->
            <div class="bg-white rounded-xl shadow-md p-6 hover:shadow-lg transition">
                <h3 class="text-lg font-semibold text-gray-800 mb-2">Card Title 1</h3>
                <p class="text-gray-600">Your content goes here.</p>
            </div>

            <!-- Card 2 -->
            <div class="bg-white rounded-xl shadow-md p-6 hover:shadow-lg transition">
                <h3 class="text-lg font-semibold text-gray-800 mb-2">Card Title 2</h3>
                <p class="text-gray-600">Your content goes here.</p>
            </div>

            <!-- Card 3 -->
            <div class="bg-white rounded-xl shadow-md p-6 hover:shadow-lg transition">
                <h3 class="text-lg font-semibold text-gray-800 mb-2">Card Title 3</h3>
                <p class="text-gray-600">Your content goes here.</p>
            </div>
        </div>

        <!-- Full Width Section -->
        <div class="bg-white rounded-2xl shadow-xl p-8 mt-6">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">Recent Activity</h3>
            <p class="text-gray-600">Add your tables, lists, or other content here.</p>
        </div>
    </main>
</body>
</html>
