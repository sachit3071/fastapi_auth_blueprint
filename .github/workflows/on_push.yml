name: PR Build and Test

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Create virtualenv with uv and install tools
      run: |
        python -m pip install --upgrade pip uv
        python -m uv sync

    - name: Check formatting with Black
      # The '--check' flag ensures Black runs in read-only mode and fails the job if files are not formatted correctly.
      run: |
        ./.venv/bin/black --check .

    - name: Lint with Flake8
      # Flake8 will automatically read your pyproject.toml configuration if pyproject-flake8 is installed.
      run: |
        ./.venv/bin/flake8 .
